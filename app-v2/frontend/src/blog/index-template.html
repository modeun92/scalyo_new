<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{title}}</title>
<meta name="description" content="{{description}}" />
<meta name="robots" content="index, follow" />
<meta name="theme-color" content="#8B5CF6" />
<link rel="canonical" href="{{url}}" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Scalyo" />
<meta property="og:title" content="{{title}}" />
<meta property="og:description" content="{{description}}" />
<meta property="og:url" content="{{url}}" />
<meta property="og:image" content="{{og_image}}" />
<meta property="og:locale" content="fr_FR" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="{{og_image}}" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<style>
:root{--ink:#16182B;--ink-soft:#5A6080;--line:#E6E8F2;--bg:#FBFAFF;--card:#FFFFFF;
  --violet:#8B5CF6;--rose:#FF4D8D;--cyan:#22B8F0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--violet);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:980px;margin:0 auto;padding:0 24px}
header.top{border-bottom:1px solid var(--line);background:#fff}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
header.top img{height:30px;width:auto;display:block}
.hero{padding:74px 0 44px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.36em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 18px}
h1{font-size:clamp(34px,5.4vw,52px);line-height:1.08;letter-spacing:-.03em;margin:0 0 18px;font-weight:800}
.lead{font-size:19px;color:var(--ink-soft);max-width:660px;margin:0}
.rule{height:4px;width:132px;border-radius:2px;margin:32px 0 0;
  background:linear-gradient(90deg,var(--rose),var(--violet) 55%,var(--cyan))}
.grid{display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));padding-bottom:16px}
.post{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column;transition:transform .18s ease,box-shadow .18s ease}
.post:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(22,24,43,.09);text-decoration:none}
.post img{width:100%;height:auto;display:block;aspect-ratio:1200/630;object-fit:cover;background:#F2F3F9}
.post .body{padding:20px 22px 24px}
.cat{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--violet);margin-bottom:10px}
.post h2{font-size:20px;line-height:1.3;letter-spacing:-.015em;margin:0 0 9px;font-weight:800;color:var(--ink)}
.post p{margin:0 0 14px;color:var(--ink-soft);font-size:14.5px}
time{color:var(--ink-soft);font-size:13px}
footer{margin-top:70px;border-top:1px solid var(--line);background:#fff}
footer .wrap{padding:26px 24px;display:flex;flex-wrap:wrap;gap:16px;
  justify-content:space-between;color:var(--ink-soft);font-size:13.5px}
@media (prefers-color-scheme:dark){
  :root{--ink:#F4F6FC;--ink-soft:#9AA3BF;--line:#242942;--bg:#0A0F1F;--card:#11162A}
  header.top,footer{background:#0D1223}
  a{color:#9DB9FF}
  .post h2{color:var(--ink)}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a href="/" aria-label="Scalyo">
      <img src="/scalyo-logo-wordmark.png" alt="Logo Scalyo — plateforme Customer Success" width="900" height="260" />
    </a>
    <a href="/" data-i18n="back">{{back}}</a>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <p class="kicker" data-i18n="kicker">{{kicker}}</p>
    <h1 data-i18n="h1">{{h1}}</h1>
    <p class="lead" data-i18n="subtitle">{{subtitle}}</p>
    <div class="rule"></div>
  </section>

  <div class="grid">
{{cards}}
  </div>
</main>

<footer>
  <div class="wrap">
    <span>Scalyo — {{tagline}}</span>
    <span><a href="/">{{nav_home}}</a> · <a href="/presse/">{{nav_press}}</a> · <a href="/cgu">{{nav_cgu}}</a> · <a href="/privacy">{{nav_privacy}}</a></span>
  </div>
</footer>

<script type="application/ld+json">{{json_ld}}</script>
<script>{{i18n_script}}</script>

</body>
</html>
